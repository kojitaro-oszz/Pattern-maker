<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>型紙・編み図メーカー</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2622;--card:#fff;--ac:#c4577a;--mut:#8a7f76;--bd:#e4dcd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a18;--fg:#f1ebe4;--card:#2a2623;--ac:#ee86a6;--mut:#a89c91;--bd:#423b36}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:12px;max-width:760px;margin:auto}
h1{font-size:18px;margin:4px 0 10px}
nav{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px 4px;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;font-weight:600}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:8px}
label{display:block;font-size:12px;color:var(--mut)}
input[type=number],select{width:100%;box-sizing:border-box;padding:7px;margin-top:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}.chips label{display:flex;align-items:center;gap:5px;color:var(--fg);font-size:13px}
button.pb,.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600;margin:2px}
.btn.s{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.note{font-size:12px;color:var(--mut)}
.card svg{display:block;margin:auto}
.line{font-size:13px;padding:2px 0;border-bottom:1px dotted var(--bd)}
canvas{width:100%;touch-action:none;border:1px solid var(--bd);border-radius:8px;background:#fff}
#pa{display:none}
@media print{@page{size:A4;margin:10mm}body>*:not(#pa){display:none!important}#pa{display:block;color:#000;background:#fff}
.pg{width:190mm;height:277mm;overflow:hidden;position:relative;page-break-after:always;outline:.2mm dashed #999}.pg svg{position:absolute;color:#000}.pg i{position:absolute;right:2mm;top:1mm;font:9pt sans-serif}}
</style></head><body>
<h1>🧵 型紙・編み図メーカー</h1>
<nav><button class="tab on" data-p="p1">洋裁型紙</button><button class="tab" data-p="p2">編み図</button><button class="tab" data-p="p3">お絵描き</button></nav>

<section class="pane" id="p1">
<div class="card"><label>アイテム<select id="item"></select></label><div id="sf" class="g"></div>
<div class="g"><label>縫い代(cm)<input id="sa" type="number" value="1" step="0.5"></label></div>
<div class="chips"><label><input type="checkbox" id="full">左右展開(わ→全体)</label><label><input type="checkbox" id="fh">左右反転</label><label><input type="checkbox" id="fv">上下反転</label><label><input type="checkbox" id="bk">後ろ側</label></div></div>
<div class="card" id="sv"></div>
<button class="pb" onclick="pr('s')">🖨 実寸でA4分割印刷</button>
<p class="note">実線=出来上がり線、点線=縫い代つき裁ち線。印刷は「拡大縮小なし(100%)」で、10cm角で寸法を確認し、ページ番号(列-行)順に貼り合わせてください。ゆとりは出来上がり寸法に加算されます。</p>
</section>

<section class="pane" id="p2" hidden>
<div class="card"><div class="g">
<label>形<select id="cshape"><option value="disc">円盤(底・コースター)<option value="ball">球(あみぐるみ)<option value="cyl">筒(バッグ・ポーチ)<option value="flat">平編み(シート・マフラー)<option value="bag">バッグ(楕円底+側面)<option value="top">トップス身頃(ベスト・セーター)<option value="vest">Vネックベスト身頃<option value="skirt">スカート(ウエスト→裾へ広がる)<option value="hat">ニット帽<option value="sq">バッグ(角底)<option value="dr">巾着バッグ<option value="pouch">フタ付きポーチ<option value="sleeve">袖(増し目で広がる)</select></label>
<label>編み目<select id="ctype"><option value="st">細編み<option value="hd">中長編み<option value="dc">長編み<option value="tr">長々編み<option value="ss">引き抜き編み<option value="ch">鎖編み</select></label>
<label>ゲージ 目数/10cm<input id="cg" type="number" value="22"></label>
<label>ゲージ 段数/10cm<input id="cr" type="number" value="24"></label>
<label>直径・幅・バスト・上腕幅(cm)<input id="cd" type="number" value="10"></label>
<label>高さ(cm)<input id="ch" type="number" value="10"></label>
<label>ゆとり・縮み補正(%)<input id="ce" type="number" value="0"></label><label>奥行き・袖口幅(cm)<input id="cw" type="number" value="12"></label><label>袖ぐり深さ(cm)<input id="cah" type="number" value="20"></label><label>持ち手の長さ(cm)<input id="chl" type="number" value="40"></label></div>
<div class="chips"><label><input type="checkbox" id="cfh">左右反転</label><label><input type="checkbox" id="cfv">上下反転</label><label><input type="checkbox" id="cbk">裏面から見る</label><label><input type="checkbox" id="cbd">後ろ身頃(ネック浅め)</label></div></div>
<div class="card" id="cout"></div>
<button class="pb" onclick="pr('c')">🖨 編み図を印刷</button>
<p class="note">記号: ×細編み / T中長編み / 斜線つきT長編み / V増し目 / Λ減らし目 / ○鎖編み。ゲージは試し編みの値に直すと精度が上がります。</p>
</section>

<section class="pane" id="p3" hidden>
<div class="card">
<div><button class="btn" id="b0">前</button><button class="btn s" id="b1">後</button></div>
<div class="g"><label>テンプレート<select id="tp"><option value="">選ぶ…</select></label>
<label>色<input id="col" type="color" value="#c4577a" style="width:100%;height:38px"></label>
<label>太さ<input id="sz" type="number" value="6" min="1" max="60"></label></div>
<div class="chips"><label><input type="checkbox" id="mh">左右対称に描く</label><label><input type="checkbox" id="mv">上下対称に描く</label><label><input type="checkbox" id="both">前後同時に描く</label><label><input type="checkbox" id="er">消しゴム</label></div>
<div id="cvw" style="margin-top:10px"></div>
<div style="margin-top:8px"><button class="btn s" id="un">↩ 戻す</button><button class="btn s" id="cl">全消去</button><button class="btn s" id="sv2">PNG保存</button><button class="btn" onclick="pr('d')">🖨 印刷</button></div></div>
</section>
<div id="pa"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],f=id=>+$('#'+id).value;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x==b));$$('.pane').forEach(p=>p.hidden=p.id!=b.dataset.p)});

/* ---------- 洋裁 ---------- */
const bz=(a,b,c,d,n=10)=>{let r=[];for(let i=1;i<=n;i++){let t=i/n,u=1-t,k=[u*u*u,3*u*u*t,3*u*t*t,t*t*t];r.push([k[0]*a[0]+k[1]*b[0]+k[2]*c[0]+k[3]*d[0],k[0]*a[1]+k[1]*b[1]+k[2]*c[1]+k[3]*d[1]])}return r};
const R=(a,b)=>[[0,0],[a,0],[a,b],[0,b]];
const S={
top:{n:'トップス身頃',F:[['bust','バスト',84],['ease','ゆとり',10],['len','着丈',55],['shoulder','肩幅',38],['neck','首回り(幅)',17],['arm','袖ぐり深さ',21]],
build(v,bk){const W=(v.bust+v.ease)/4,sw=v.shoulder/2,nw=v.neck/2,nd=bk?2.5:7,sd=4,ad=v.arm,L=v.len;
const p=[[0,nd],...bz([0,nd],[nw*.55,nd],[nw,nd*.45],[nw,0]),[sw,sd],...bz([sw,sd],[sw-1.5,sd+(ad-sd)*.5],[sw+(W-sw)*.4,ad],[W,ad],12),[W,L],[0,L]];
return[{name:(bk?'後ろ':'前')+'身頃',pts:p,fold:1,note:'中心わ'}]}},
skirt:{n:'タイトスカート',F:[['waist','ウエスト',66],['hip','ヒップ',92],['ease','ゆとり',4],['len','スカート丈',58],['hd','ヒップ位置(腰から)',18]],
build(v,bk){const H=(v.hip+v.ease)/4,Wd=(v.waist+v.ease/2)/4,D=Math.max(0,H-Wd),sx=H-.4*D,dw=.6*D,dl=bk?14:10,c=sx/2,L=v.len,hd=v.hd;
const p=[[0,0],[c-dw/2,0],[c,dl],[c+dw/2,0],[sx,0],...bz([sx,0],[sx+(H-sx)*.2,hd*.4],[H,hd*.5],[H,hd],6),[H,L],[0,L]];
return[{name:(bk?'後ろ':'前')+'スカート',pts:p,fold:1,note:'中心わ・ダーツ1本'}]}},
bag:{n:'トート/ポーチ',F:[['w','横幅',30],['h','高さ',25],['g','マチ(底)',10],['ease','ゆとり',1],['hl','持ち手長さ',45],['hw','持ち手幅',3]],
build(v){const w=v.w+v.ease,h=v.h+v.ease;return[{name:'本体',pts:R(w,h),note:'2枚'},{name:'マチ(底)',pts:R(w,v.g),note:'1枚'},{name:'持ち手',pts:R(v.hl,v.hw*2),note:'2本(中表に折る)'}]}}};
$('#item').innerHTML=Object.entries(S).map(([k,c])=>`<option value="${k}">${c.n}`).join('');
const fields=()=>$('#sf').innerHTML=S[$('#item').value].F.map(([i,l,d])=>`<label>${l}(cm)<input id="s_${i}" type="number" inputmode="decimal" step="0.5" value="${d}">`).join('');
function off(p,d){const n=p.length;let a=0;for(let i=0;i<n;i++){const q=p[(i+1)%n];a+=p[i][0]*q[1]-q[0]*p[i][1]}const s=a>0?1:-1;
const nm=(u,w)=>{const dx=w[0]-u[0],dy=w[1]-u[1],l=Math.hypot(dx,dy)||1;return[dy/l*s,-dx/l*s]};
return p.map((q,i)=>{const n1=nm(p[(i+n-1)%n],q),n2=nm(q,p[(i+1)%n]),m=[n1[0]+n2[0],n1[1]+n2[1]],ml=Math.hypot(...m)||1,u=[m[0]/ml,m[1]/ml],k=Math.min(2.5,1/Math.max(.2,u[0]*n1[0]+u[1]*n1[1]));return[q[0]+u[0]*d*k,q[1]+u[1]*d*k]})}
const PR={};
function rs(){const c=S[$('#item').value],v={};c.F.forEach(([id])=>v[id]=f('s_'+id)||0);
const sa=f('sa')||0,full=$('#full').checked,fh=$('#fh').checked,fv=$('#fv').checked,bk=$('#bk').checked;let x=20,Hm=0,o='';
c.build(v,bk).forEach(p=>{let q=p.pts;const fold=p.fold&&!full;
if(p.fold&&full){const m=[];for(let i=q.length-1;i>=0;i--)if(q[i][0]>1e-6)m.push([-q[i][0],q[i][1]]);q=q.concat(m)}
let s=off(q,sa);if(fold)s=s.map(a=>[Math.max(0,a[0]),a[1]]);
const T=a=>[(fh?-a[0]:a[0])*10,(fv?-a[1]:a[1])*10];q=q.map(T);s=s.map(T);
const xs=s.map(a=>a[0]),ys=s.map(a=>a[1]),mx=Math.min(...xs),my=Math.min(...ys),dx=x-mx,dy=30-my,w=Math.max(...xs)-mx,h=Math.max(...ys)-my;
const P=r=>r.map(a=>(a[0]+dx).toFixed(1)+','+(a[1]+dy).toFixed(1)).join(' '),cx=x+w/2,cy=30+h/2;
o+=`<polygon points="${P(s)}" fill="none" stroke="currentColor" stroke-dasharray="6 4" stroke-width=".6"/><polygon points="${P(q)}" fill="none" stroke="currentColor" stroke-width="1.2"/>
<path d="M${cx} ${cy-h*.3}V${cy+h*.3}M${cx-6} ${cy-h*.3+12}L${cx} ${cy-h*.3}L${cx+6} ${cy-h*.3+12}M${cx-6} ${cy+h*.3-12}L${cx} ${cy+h*.3}L${cx+6} ${cy+h*.3-12}" stroke="currentColor" fill="none" stroke-width=".8"/>
<text x="${cx+10}" y="${cy-6}" font-size="14" fill="currentColor">${p.name}</text><text x="${cx+10}" y="${cy+12}" font-size="11" fill="currentColor">${p.note}(布目)${fold?'':''}</text>`;
Hm=Math.max(Hm,h+30);x+=w+40});
o+=`<rect x="20" y="${Hm+30}" width="100" height="100" fill="none" stroke="currentColor" stroke-width=".8"/><text x="26" y="${Hm+85}" font-size="11" fill="currentColor">10cm×10cm 確認</text>`;
const W=Math.max(x,160),H=Hm+160;
PR.s=Array.from({length:Math.ceil(H/277)},(_,r)=>Array.from({length:Math.ceil(W/190)},(_,c)=>`<div class="pg"><svg style="left:${-c*190}mm;top:${-r*277}mm" width="${W}mm" height="${H}mm" viewBox="0 0 ${W} ${H}">${o}</svg><i>${c+1}-${r+1}</i></div>`).join('')).join('');
$('#sv').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--fg)">${o}</svg>`}

/* ---------- 編み図 ---------- */
const GP={st:[22,24],hd:[18,16],dc:[16,12],tr:[14,9],ss:[22,30],ch:[22,24]},PI=Math.PI,SD={disc:[10,10,12],ball:[10,10,12],cyl:[10,10,12],flat:[20,20,12],bag:[25,20,12],top:[90,55,12],sleeve:[30,45,18],sq:[25,20,12],dr:[20,25,12],pouch:[18,14,12],vest:[90,55,12],skirt:[66,50,110],hat:[54,20,12]};
const B={st:'M-4 0L4-9M4 0L-4-9',hd:'M-4-9H4M0-9V0',dc:'M-4-9H4M0-9V0M-3-3L3-6',tr:'M-4-9H4M0-9V0M-3-2L3-4M-3-4.5L3-6.5',ch:'M-3-4a3 3 0 1 0 6 0a3 3 0 1 0-6 0',ss:'M-1.5-3a1.5 1.5 0 1 0 3 0a1.5 1.5 0 1 0-3 0M-4-3H4'};
function sy(o,tp,x,y,th,k=1,fl=1){const d=o=='c'?B.ch:B[tp],t=`translate(${x.toFixed(1)} ${y.toFixed(1)})rotate(${th.toFixed(1)})`,m=(extra)=>`<path transform="${t}${extra}scale(${k} ${k*fl})" d="${d}"/>`;
if(o=='s'||o=='c')return m('');if(o=='i')return m('rotate(-24)')+m('rotate(24)');if(o=='t')return m('rotate(-32)')+m('')+m('rotate(32)');
return m('translate(-4 0)rotate(20)')+m('translate(4 0)rotate(-20)')}
const flips=()=>[$('#cfh').checked^$('#cbk').checked,$('#cfv').checked];
function ring(L,tp,title){const mi=Math.max(...L.map(r=>r.idx)),Rr=30+mi*24+30,C=Rr,[fh,fv]=flips();let g='',lb='';
L.forEach(r=>{const rad=30+r.idx*24;g+=`<circle cx="${C}" cy="${C}" r="${rad}" stroke-opacity=".15"/>`;let s=0;
r.ops.forEach(o=>{const pos=o=='i'?s+1:s+.5,th=360*pos/r.cnt;g+=sy(o,tp,C+rad*Math.sin(th*PI/180),C-rad*Math.cos(th*PI/180),th);s+=o=='i'?2:1});
lb+=`<text x="${C-20}" y="${C-rad+4}" font-size="9" fill="currentColor" stroke="none">${r.n}</text>`});
return`<p class="note"><b>${title}</b></p><svg viewBox="0 0 ${2*Rr} ${2*Rr}" style="width:100%;max-width:${2*Rr}px;color:var(--fg)"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="${C}" cy="${C}" r="6"/><g transform="translate(${C} ${C})scale(${fh?-1:1} ${fv?-1:1})translate(${-C} ${-C})">${g}</g></g>${lb}</svg>`}
function flat(ch,rows,tp){const c=22,[fh,fv]=flips(),Wd=ch*c+80,Ht=(rows+1)*c+20,X=j=>60+(fh?ch-1-j:j)*c+c/2,yb=i=>fv?10+i*c:10+(rows-i)*c+c;let g='',lb='';
for(let j=0;j<ch;j++)g+=`<circle cx="${X(j)}" cy="${yb(0)+(fv?c/2:-c/2)}" r="5"/>`;
for(let i=1;i<=rows;i++){for(let j=0;j<ch;j++)g+=sy('s',tp,X(j),yb(i),0,1.3,fv?-1:1);}
for(let i=0;i<=rows;i++){const dir=(i%2?'←':'→'),ar=fh?(dir=='←'?'→':'←'):dir;lb+=`<text x="4" y="${yb(i)+(fv?c/2+4:-c/2+4)}" font-size="11" fill="currentColor" stroke="none">${i?i+ar:'鎖'}</text>`}
return`<div style="overflow-x:auto"><svg width="${Wd}" height="${Ht}" viewBox="0 0 ${Wd} ${Ht}" style="color:var(--fg);margin:0"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">${g}</g>${lb}</svg></div>`}
function tk(t,r,L){const P=2*L+2*PI*r;t=((t%P)+P)%P;if(t<L)return[-L/2+t,-r,0];t-=L;if(t<PI*r){const a=t/r;return[L/2+r*Math.sin(a),-r*Math.cos(a),a*180/PI]}t-=PI*r;if(t<L)return[L/2-t,r,180];t-=L;const a=t/r+PI;return[-L/2+r*Math.sin(a),-r*Math.cos(a),a*180/PI]}
function trk(L,tp,a,title){const Ln=a*23,mr=18+22*(Math.max(...L.map(r=>r.n))-1),Wd=Ln+2*mr+40,Ht=2*mr+40,cx=Wd/2,cy=Ht/2,[fh,fv]=flips();let g='';
L.forEach(r=>{const rho=18+22*(r.n-1),P=2*Ln+2*PI*rho;g+=`<rect x="${cx-Ln/2-rho}" y="${cy-rho}" width="${Ln+2*rho}" height="${2*rho}" rx="${rho}" stroke-opacity=".15"/>`;let s=0;
r.ops.forEach(o=>{const w=o=='i'?2:o=='t'?3:1,q=tk((s+(o=='s'||o=='d'?.5:w/2))/r.cnt*P,rho,Ln);g+=sy(o,tp,cx+q[0],cy+q[1],q[2]);s+=w})});
return`<p class="note"><b>${title}</b></p><svg viewBox="0 0 ${Wd} ${Ht}" style="width:100%;max-width:${Wd}px;color:var(--fg)"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><g transform="translate(${cx} ${cy})scale(${fh?-1:1} ${fv?-1:1})translate(${-cx} ${-cy})">${g}</g></g></svg>`}
function flatR(ch,R,tp,rd){const cols=Math.max(ch,...R.map(r=>r.length)),c=Math.min(22,Math.max(11,880/cols)),k=c/17,[fh,fv]=flips(),rows=R.length,Wd=cols*c+80,Ht=(rows+1)*c+20,X=(j,n)=>60+((fh?n-1-j:j)+(cols-n)/2)*c+c/2,yb=i=>fv?10+i*c:10+(rows-i)*c+c;let g='',lb='';
for(let j=0;j<(rd?0:ch);j++)g+=`<circle cx="${X(j,ch)}" cy="${yb(0)+(fv?c/2:-c/2)}" r="${c/4}"/>`;
R.forEach((r,i)=>r.forEach((o,j)=>{if(o)g+=sy(o,tp,X(j,r.length),yb(i+1),0,k,fv?-1:1)}));
for(let i=0;i<=rows;i++){const dir=i%2?'←':'→',ar=fh?(dir=='←'?'→':'←'):dir;lb+=`<text x="4" y="${yb(i)+(fv?c/2+4:-c/2+4)}" font-size="10" fill="currentColor" stroke="none">${i?i+(rd?'↺':ar):rd?'':'鎖'}</text>`}
return`<div style="overflow-x:auto"><svg width="${Wd}" height="${Ht}" viewBox="0 0 ${Wd} ${Ht}" style="color:var(--fg);margin:0"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">${g}</g>${lb}</svg></div>`}
const sdv=(n,sr,tp,mid)=>{const s=Math.min(sr,12);return`<p class="note"><b>側面の編み図(輪の展開図・${n}目×${sr}段のうち${s}段分。以降は同じ)</b></p>`+flatR(n,Array.from({length:s},(_,i)=>mid&&i==Math.min(mid,s)-1?Array.from({length:n},(_,j)=>j%3?'c':'s'):Array(n).fill('s')),tp,1)};
const LG=()=>{const a=[['s','ch','鎖'],['s','ss','引抜'],['s','st','細'],['s','hd','中長'],['s','dc','長'],['s','tr','長々'],['i','st','増'],['d','st','減']];return`<p class="note"><b>記号一覧</b></p><svg viewBox="0 0 ${a.length*42} 34" style="width:100%;color:var(--fg)"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">${a.map(([o,k],i)=>sy(o,k,i*42+21,22,0)).join('')}</g>${a.map(([o,k,t],i)=>`<text x="${i*42+21}" y="33" font-size="8" text-anchor="middle" fill="currentColor">${t}</text>`).join('')}</svg>`};
function rc(){const sh=$('#cshape').value,tp=$('#ctype').value,sg=f('cg')||1,rg=f('cr')||1,e=1+f('ce')/100,d=f('cd')*e,h=f('ch')*e,tn={st:'細編み',hd:'中長編み',dc:'長編み',tr:'長々編み',ch:'鎖編み',ss:'引き抜き編み'}[tp];
const k=Math.max(2,Math.round(PI*d*sg/60)),rp=(n,w)=>[].concat(...Array(6).fill([...Array(Math.max(0,n-2)).fill('s'),w])),
I=n=>({n,cnt:6*n,idx:n,ops:n==1?Array(6).fill('s'):rp(n,'i'),tx:n==1?`輪の作り目に${tn}6目`:`(${tn}${n>2?n-2+'目、':''}増し目)×6`}),

for(let i=1;i<=H;i++){let dr=0;if(i>rA&&(i-rA)%2==1&&dec<m){dr=1;dec++;cur-=2}let r;
if(i>H-nd){const gp=vn?Math.min(nw,2*(i-(H-nd))):nw,b=Math.floor((cur-gp)/2);r=[...Array(b).fill('s'),...Array(gp).fill(null),...Array(b).fill('s')]}else r=dr?['d',...Array(Math.max(0,cur-2)).fill('s'),'d']:Array(cur).fill('s');rows.push(r)}

for(let i=1;i<=H;i++){if(inc<n&&i%gap==0){rows.push(['i',...Array(Math.max(0,cur-2)).fill('s'),'i']);cur+=2;inc++}else rows.push(Array(cur).fill('s'))}
out=`<div class="line">作り目: 鎖編み${w0}目(袖口)</div><div class="line">${gap}段ごとに両端で1目ずつ増し目×${n}回(${w0}→${w0+2*n}目)</div><div class="line">全${H}段で袖丈約${(H*10/rg).toFixed(1)}cm。2枚編む</div>`+flatR(w0,rows,tp)}
else if(sh=='sq'){const w=Math.max(4,Math.round(d*sg/10)),br=Math.max(2,Math.round(f('cw')*e*rg/10)),sr=Math.max(1,Math.round(h*rg/10)),n=2*(w+br);
out=`<div class="line">底: 鎖編み${w}目で${br}段の長方形(${w}目×${br}段)</div><div class="line">側面: 底の周囲${n}目を拾い、${tn}を輪で${sr}段(各段${n}目)</div><div class="line">角の4か所は1目ずつ増し目すると立ち上がります</div>`+flatR(w,Array.from({length:br},()=>Array(w).fill('s')),tp)+sdv(n,sr,tp)}
else if(sh=='dr'){const k2=Math.max(2,Math.round(PI*d*sg/60)),sr=Math.max(4,Math.round(h*rg/10)),n=6*k2,L=[];for(let i=1;i<=k2;i++){L.push(I(i));ln(i,i,I(i).tx,6*i)}
out=tx.join('')+`<div class="line">側面: ${tn}を各段${n}目、${sr-2}段目は穴あき段(${tn}1目、鎖編み2目を繰り返し、鎖の下は2目飛ばす)</div><div class="line">穴の段のあと2段を${n}目で編み、ひもを通す</div>`+ring(L,tp,'底の編み図')+sdv(n,sr,tp,sr-2)}
else if(sh=='pouch'){const W=Math.max(6,Math.round(d*sg/10)),H=Math.max(4,Math.round(h*rg/10)),rows=[];let cur=W;for(let i=0;i<H;i++)rows.push(Array(cur).fill('s'));while(cur>5){cur-=2;rows.push(['d',...Array(Math.max(0,cur-2)).fill('s'),'d'])}

/* ---------- お絵描き ---------- */
const N=700,cv=[0,1].map(()=>{const c=document.createElement('canvas');c.width=c.height=N;return c}),cx=cv.map(c=>c.getContext('2d')),hist=[[],[]];let side=0,dr=0,last;
cx.forEach(c=>{c.fillStyle='#fff';c.fillRect(0,0,N,N);c.lineCap=c.lineJoin='round'});
$('#cvw').append(cv[0],cv[1]);cv[1].hidden=true;
[0,1].forEach(i=>$('#b'+i).onclick=()=>{side=i;cv.forEach((c,j)=>c.hidden=j!=i);[0,1].forEach(j=>$('#b'+j).className='btn'+(j==i?'':' s'))});
const tg=()=>$('#both').checked?[0,1]:[side],pt=(e,c)=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*N/r.width,(e.clientY-r.top)*N/r.height]};
function snap(){tg().forEach(j=>{hist[j].push(cx[j].getImageData(0,0,N,N));if(hist[j].length>15)hist[j].shift()})}
function seg(a,b){tg().forEach(j=>{const c=cx[j];c.strokeStyle=$('#er').checked?'#fff':$('#col').value;c.lineWidth=f('sz');let m=[[a,b]];
if($('#mh').checked)m.push([[N-a[0],a[1]],[N-b[0],b[1]]]);if($('#mv').checked)m=m.concat(m.map(([p,q])=>[[p[0],N-p[1]],[q[0],N-q[1]]]));

c.onpointermove=e=>{if(!dr)return;const p=pt(e,c);seg(last,p);last=p};c.onpointerup=()=>dr=0});
$('#un').onclick=()=>tg().forEach(j=>{const h=hist[j].pop();h&&cx[j].putImageData(h,0,0)});
$('#cl').onclick=()=>{snap();tg().forEach(j=>{cx[j].fillStyle='#fff';cx[j].fillRect(0,0,N,N)})};
$('#sv2').onclick=()=>{const a=document.createElement('a');a.href=cv[side].toDataURL();a.download='design.png';a.click()};
const ht=(c,x,y,s)=>{c.beginPath();c.moveTo(x,y+s*.35);c.bezierCurveTo(x-s,y-s*.3,x-s*.5,y-s*.9,x,y-s*.4);c.bezierCurveTo(x+s*.5,y-s*.9,x+s,y-s*.3,x,y+s*.35);c.fill()};
const grid=(c,st,fn)=>{for(let y=0,i=0;y<N;y+=st,i++)for(let x=0,j=0;x<N;x+=st,j++)fn(x,y,i,j)};
const TP={'ストライプ':c=>grid(c,50,(x,y,i,j)=>j%2||c.fillRect(x,0,50,y?0:N)),'ボーダー':c=>grid(c,50,(x,y,i,j)=>i%2||j||c.fillRect(0,y,N,50)),
'水玉':c=>grid(c,70,(x,y,i)=>{c.beginPath();c.arc(x+35+(i%2?35:0),y+35,15,0,7);c.fill()}),'チェック':c=>grid(c,50,(x,y,i,j)=>(i+j)%2||c.fillRect(x,y,50,50)),
'ハート柄':c=>grid(c,90,(x,y,i)=>ht(c,x+45+(i%2?45:0),y+55,32)),
'お花':c=>grid(c,110,(x,y,i)=>{const X=x+55+(i%2?55:0),Y=y+55;for(let a=0;a<5;a++){c.beginPath();c.arc(X+22*Math.cos(a*1.2566),Y+22*Math.sin(a*1.2566),14,0,7);c.fill()}c.save();c.fillStyle='#fff';c.beginPath();c.arc(X,Y,9,0,7);c.fill();c.restore()})};
$('#tp').innerHTML+=Object.keys(TP).map(k=>`<option>${k}`).join('');
$('#tp').onchange=e=>{const t=TP[e.target.value];if(!t)return;snap();tg().forEach(j=>{cx[j].fillStyle=$('#col').value;t(cx[j])});e.target.value=''};
